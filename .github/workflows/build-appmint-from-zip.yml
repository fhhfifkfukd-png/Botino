# Build AppMint APK from uploaded ZIP

name: Build AppMint APK from ZIP

on:
  push:
    paths:
      - 'AppMint_GitHub_APK_Project.zip'
      - '.github/workflows/build-appmint-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project ZIP
        run: |
          mkdir -p build-source
          unzip -q AppMint_GitHub_APK_Project.zip -d build-source
          test -f build-source/settings.gradle.kts
          test -f build-source/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: build-source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppMint-Android-APK
          path: build-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
